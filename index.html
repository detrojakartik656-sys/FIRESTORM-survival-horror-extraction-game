<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05070a" />
<title>FIRESTORM — Step 2</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#05070a; }
  body { touch-action:none; user-select:none; -webkit-user-select:none;
         -webkit-tap-highlight-color:transparent; font-family:system-ui,sans-serif; color:#e6edf5; }
  #app { display:block; width:100%; height:100%; }

  #crosshair { position:fixed; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px;
               border-radius:50%; background:rgba(255,255,255,.8); box-shadow:0 0 6px #000;
               pointer-events:none; transition:background .08s; }
  #crosshair.hit { background:#ff3b3b; width:10px; height:10px; margin:-5px 0 0 -5px; }

  #hud { position:fixed; left:14px; top:12px; color:#66788c; font-size:10px;
         letter-spacing:.14em; line-height:1.9; text-transform:uppercase; pointer-events:none; }

  #objective { position:fixed; top:14px; left:50%; transform:translateX(-50%);
               font-size:11px; letter-spacing:.2em; text-transform:uppercase;
               color:#9fb3c8; text-align:center; pointer-events:none; white-space:nowrap; }
  #timer { margin-top:6px; font-size:22px; letter-spacing:.14em; color:#ffcb6b;
           font-weight:700; pointer-events:none; text-align:center; opacity:0; transition:opacity .3s; }
  #timer.on { opacity:1; }

  #vitals { position:fixed; right:16px; bottom:16px; text-align:right; pointer-events:none; }
  #hpwrap { width:150px; height:6px; background:rgba(255,255,255,.1); border-radius:3px; overflow:hidden; }
  #hpbar { height:100%; width:100%; background:#4ade80; transition:width .15s, background .15s; }
  #ammo { margin-top:10px; font-size:26px; font-weight:700; letter-spacing:.06em; color:#e6edf5; }
  #ammo span { font-size:13px; color:#66788c; font-weight:400; }
  #ammo.empty { color:#ff5252; }

  #noise { position:fixed; left:18px; top:50%; transform:translateY(-50%);
           width:5px; height:110px; background:rgba(255,255,255,.08); border-radius:3px;
           overflow:hidden; display:flex; align-items:flex-end; pointer-events:none; }
  #noisefill { width:100%; height:0%; background:#4ade80; transition:background .2s; }

  #joy { position:fixed; left:26px; bottom:26px; width:130px; height:130px; border-radius:50%;
         border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.04);
         display:none; pointer-events:none; }
  #knob { position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px;
          border-radius:50%; background:rgba(255,255,255,.16);
          border:1px solid rgba(255,255,255,.28); will-change:transform; }

  .btn { position:fixed; display:none; align-items:center; justify-content:center;
         border-radius:50%; border:1px solid rgba(255,255,255,.18);
         background:rgba(255,255,255,.07); font-size:11px; letter-spacing:.1em;
         text-transform:uppercase; color:#cfdae6; touch-action:none; }
  .btn:active { background:rgba(255,255,255,.2); }
  #fireBtn   { right:28px; bottom:34px;  width:92px; height:92px; font-size:13px;
               border-color:rgba(255,80,80,.4); background:rgba(255,60,60,.14); }
  #reloadBtn { right:132px; bottom:44px; width:62px; height:62px; }
  #useBtn    { left:50%; bottom:120px; transform:translateX(-50%); width:auto; height:46px;
               padding:0 22px; border-radius:23px; opacity:0; display:none; }

  #danger { position:fixed; inset:0; pointer-events:none; opacity:0;
            background:radial-gradient(circle at 50% 50%, transparent 32%, rgba(120,0,0,.55) 100%);
            transition:opacity .18s; }

  #overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
             justify-content:center; gap:14px; text-align:center; padding:24px;
             background:radial-gradient(circle at 50% 45%, #0b1018 0%, #05070a 72%); }
  #overlay h1 { font-size:clamp(28px,9vw,54px); letter-spacing:.2em; font-weight:800; }
  #overlay p { color:#7d8fa3; font-size:11px; letter-spacing:.16em;
               text-transform:uppercase; line-height:2; max-width:340px; }
  #overlay.dead h1 { color:#ff5252; }
  #overlay.win h1 { color:#4ade80; }
  #overlay.hidden { display:none; }
</style>
</head>
<body>
<canvas id="app"></canvas>
<div id="danger"></div>
<div id="crosshair"></div>
<div id="hud"></div>
<div id="objective">Find the relic</div>
<div id="timer">0:00</div>
<div id="noise"><div id="noisefill"></div></div>
<div id="vitals">
  <div id="hpwrap"><div id="hpbar"></div></div>
  <div id="ammo">12<span> / 12</span></div>
</div>
<div id="joy"><div id="knob"></div></div>
<button id="fireBtn"   class="btn">Fire</button>
<button id="reloadBtn" class="btn">Rel</button>
<button id="useBtn"    class="btn">Take relic</button>
<div id="overlay">
  <h1>FIRESTORM</h1>
  <p>It cannot see you.<br>It hears everything.<br><br>Click / tap to enter</p>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
